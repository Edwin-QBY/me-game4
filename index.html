<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>彈彈球大亂鬥 7.3 - 完美設定重構版</title>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            color: #fff; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        
        h1 { color: #ffcc00; margin: 0 0 10px 0; font-size: 24px; }

        #ui-panel { 
            background: #1e1e1e; 
            padding: 15px 25px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-wrap: wrap;
            gap: 15px; 
            align-items: center; 
            justify-content: center;
            border: 1px solid #333; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            max-width: 1100px;
        }
        
        .control-group { display: flex; align-items: center; gap: 5px; font-weight: bold; }
        
        input[type="number"] { 
            width: 50px; 
            padding: 6px; 
            background: #2a2a2a; 
            color: white; 
            border: 1px solid #555; 
            border-radius: 6px;
            text-align: center; 
            font-size: 14px;
        }
        
        button { 
            padding: 8px 16px; 
            cursor: pointer; 
            background: #ffcc00; 
            color: #000;
            border: none; 
            font-weight: bold; 
            border-radius: 6px; 
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background: #ffe066; }
        
        canvas { background: #0a0a0a; border: 3px solid #333; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        #status-bar { margin-top: 10px; font-size: 15px; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>

    <h1>彈彈球碰撞實驗室 🧪 v7.3</h1>

    <div id="ui-panel">
        <div class="control-group" style="color: #ff4d4d;"><span>🧛 吸血鬼:</span><input type="number" id="vampire" value="1" min="0"></div>
        <div class="control-group" style="color: #ffaa00;"><span>🏐 閃避球:</span><input type="number" id="dodgeball" value="1" min="0"></div>
        <div class="control-group" style="color: #4da6ff;"><span>♿ 輪椅:</span><input type="number" id="wheelchair" value="1" min="0"></div>
        <div class="control-group" style="color: #a0a0a0;"><span>🛡️ 盔甲:</span><input type="number" id="armor" value="1" min="0"></div>
        <div class="control-group" style="color: #00ffff;"><span>💎 寶石:</span><input type="number" id="gem" value="1" min="0"></div>
        <div class="control-group" style="color: #99ff33;"><span>🏹 弓箭:</span><input type="number" id="archer" value="1" min="0"></div>
        <div class="control-group" style="color: #ff33cc;"><span>👤 閃避大師:</span><input type="number" id="dodgemaster" value="1" min="0"></div>
        <button onclick="startGame()">🚀 生成開戰</button>
    </div>

    <canvas id="gameCanvas" width="1024" height="680"></canvas>
    <div id="status-bar">請輸入角色數量後點擊開始！</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusBar = document.getElementById('status-bar');
    
    let entities = [];
    let floatingTexts = [];
    let lasers = [];
    let arrows = [];
    let particles = [];
    const GLOBAL_BASE_SPEED = 4.0; 

    class Character {
        constructor(type) {
            this.type = type;
            this.radius = 96; // 角色放大一半
            this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
            this.y = Math.random() * (canvas.height - this.radius * 2) + this.radius;
            this.hitEffect = 0; 
            
            this.bleedTimer = 0;
            this.consecutiveDodges = 0; 
            this.dodgeCooldown = 0;
            this.dodgeSpeed = 25;       
            this.dodgeHistory = [];     

            if (type === 'vampire') {
                this.icon = '🧛';
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 100;
            } else if (type === 'dodgeball') {
                this.icon = '🏐';
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 100;
            } else if (type === 'wheelchair') {
                this.icon = '♿';
                this.baseSpeed = GLOBAL_BASE_SPEED * 0.3; // 輪椅減速 70%
                this.maxHp = 200; // 輪椅血量 200
            } else if (type === 'armor') {
                this.icon = '🛡️';
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 100;
                this.hasShattered = false;
            } else if (type === 'gem') {
                this.icon = '💎';
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 80;
                this.laserTimer = Math.floor(Math.random() * 60) + 180;
            } else if (type === 'archer') {
                this.icon = '🏹';
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 70; // 弓箭血量 70
                this.shootTimer = 90; 
            } else if (type === 'dodgemaster') {
                this.icon = '👤'; 
                this.baseSpeed = GLOBAL_BASE_SPEED;
                this.maxHp = 100;
            }
            
            this.hp = this.maxHp;
            this.speed = this.baseSpeed; 

            let angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle); 
            this.vy = Math.sin(angle);
        }

        update() {
            // 吸血鬼流血效果結算
            if (this.bleedTimer > 0) {
                this.bleedTimer--;
                if (this.bleedTimer % 60 === 0) {
                    this.hp -= 5;
                    createFloatingText(this.x, this.y - 50, "🩸 -5 流血", "#ff3333");
                }
            }

            if (this.dodgeCooldown > 0) this.dodgeCooldown--;

            // 閃避大師殘影
            if (this.type === 'dodgemaster' && this.dodgeCooldown > 35) {
                this.dodgeHistory.push({x: this.x, y: this.y});
                if (this.dodgeHistory.length > 4) this.dodgeHistory.shift();
            } else {
                this.dodgeHistory = [];
            }

            this.x += this.vx * this.speed;
            this.y += this.vy * this.speed;

            if (this.x < this.radius) { this.x = this.radius; this.vx = Math.abs(this.vx); }
            if (this.x > canvas.width - this.radius) { this.x = canvas.width - this.radius; this.vx = -Math.abs(this.vx); }
            if (this.y < this.radius) { this.y = this.radius; this.vy = Math.abs(this.vy); }
            if (this.y > canvas.height - this.radius) { this.y = canvas.height - this.radius; this.vy = -Math.abs(this.vy); }
            
            if (this.hitEffect > 0) this.hitEffect--;

            // 寶石射雷射
            if (this.type === 'gem') {
                this.laserTimer--;
                if (this.laserTimer <= 0) {
                    fireGemLaser(this);
                    this.laserTimer = 200;
                }
            }

            // 弓箭手射箭
            if (this.type === 'archer') {
                this.shootTimer--;
                if (this.shootTimer <= 0) {
                    fireArrow(this);
                    this.shootTimer = 90;
                }
            }
        }

        draw() {
            if (this.dodgeHistory.length > 0) {
                this.dodgeHistory.forEach((pos, idx) => {
                    ctx.save();
                    ctx.globalAlpha = (idx + 1) * 0.12;
                    ctx.font = `bold 110px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(this.icon, pos.x, pos.y);
                    ctx.restore();
                });
            }

            ctx.save();
            let scale = 1.0 + (this.hitEffect * 0.04);
            ctx.translate(this.x, this.y);
            ctx.scale(scale, scale);

            if (this.type === 'dodgemaster') {
                ctx.strokeStyle = '#ff33cc';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff33cc';
                ctx.beginPath();
                ctx.arc(0, 0, 50, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.font = `bold 110px sans-serif`; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = this.type === 'dodgemaster' ? '#ff33cc' : '#ffffff';
            ctx.fillText(this.icon, 0, 0);
            ctx.restore();
            
            // 純數字血量 UI 顯示
            if (this.hp > 0) {
                ctx.save();
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillStyle = this.hp > (this.maxHp * 0.3) ? '#00ff00' : '#ff3333';
                let currentHpText = Math.max(0, Math.ceil(this.hp));
                ctx.fillText(`${currentHpText} / ${this.maxHp}`, this.x, this.y + 105);
                ctx.restore();
            }
        }
    }

    function createFloatingText(x, y, text, color) {
        floatingTexts.push({ x: x, y: y, text: text, color: color, life: 50 });
    }

    function fireArrow(archer) {
        let nearest = null; let minDist = Infinity;
        entities.forEach(other => {
            if (other !== archer && other.type !== 'archer' && other.hp > 0) {
                let d = Math.hypot(other.x - archer.x, other.y - archer.y);
                if (d < minDist) { minDist = d; nearest = other; }
            }
        });
        if (nearest) {
            let angle = Math.atan2(nearest.y - archer.y, nearest.x - archer.x);
            arrows.push({
                x: archer.x, y: archer.y,
                vx: Math.cos(angle), vy: Math.sin(angle),
                speed: 8, damage: 30, owner: archer, isCounter: false
            });
        }
    }

    function fireGemLaser(gem) {
        let nearestEnemy = null; let minDist = Infinity;
        entities.forEach(other => {
            if (other.type !== 'gem' && other.hp > 0) {
                let d = Math.hypot(other.x - gem.x, other.y - gem.y);
                if (d < minDist) { minDist = d; nearestEnemy = other; }
            }
        });

        if (nearestEnemy) {
            if (nearestEnemy.type === 'dodgemaster' && nearestEnemy.dodgeCooldown <= 0) {
                triggerDodgeAction(nearestEnemy, gem.x, gem.y);
                createFloatingText(nearestEnemy.x, nearestEnemy.y - 75, '⚡ 雷射閃避！', '#ff33cc');
            } else {
                nearestEnemy.hp -= 20;
                lasers.push({ x1: gem.x, y1: gem.y, x2: nearestEnemy.x, y2: nearestEnemy.y, life: 10 });
                createFloatingText(nearestEnemy.x, nearestEnemy.y - 75, `⚡ -20 雷射`, '#00ffff');
            }
        }
    }

    function triggerDodgeAction(dm, threatX, threatY) {
        dm.dodgeCooldown = 45; 
        let dx = dm.x - threatX; let dy = dm.y - threatY;
        let dist = Math.hypot(dx, dy) || 1;
        
        dm.x += (dx / dist) * dm.dodgeSpeed * 5;
        dm.y += (dy / dist) * dm.dodgeSpeed * 5;
        dm.vx = dx / dist; dm.vy = dy / dist;
        
        dm.dodgeSpeed *= 0.95; // 躲避速度永久降低 5%
    }

    function triggerArmorShatter(armor) {
        particles.push({x: armor.x, y: armor.y, radius: 10, maxRadius: 300, life: 20});
        entities.forEach(other => {
            if (other !== armor && other.type !== 'armor' && other.hp > 0) {
                let dist = Math.hypot(other.x - armor.x, other.y - armor.y);
                if (dist <= 300) { 
                    other.hp -= 30;
                    createFloatingText(other.x, other.y - 75, `💥 碎甲波及 -30`, '#a0a0a0');
                }
            }
        });
    }

    function startGame() {
        entities = []; floatingTexts = []; lasers = []; arrows = []; particles = [];
        const types = ['vampire', 'dodgeball', 'wheelchair', 'armor', 'gem', 'archer', 'dodgemaster'];
        
        types.forEach(t => {
            let count = parseInt(document.getElementById(t).value) || 0;
            for(let i = 0; i < count; i++) { entities.push(new Character(t)); }
        });
        statusBar.innerText = entities.length === 0 ? "戰場空無一人！" : "大亂鬥全面開打！";
    }

    function checkCollisions() {
        // 1. 預檢判定：閃避大師碰撞前閃避，並判定閃避球被閃避邏輯
        for (let i = 0; i < entities.length; i++) {
            for (let j = 0; j < entities.length; j++) {
                if (i === j) continue;
                let e1 = entities[i], e2 = entities[j];
                if (e1.hp <= 0 || e2.hp <= 0 || e1.type === e2.type) continue; // 同陣營穿透不衝突

                if (e1.type === 'dodgemaster' && e1.dodgeCooldown <= 0) {
                    let dist = Math.hypot(e2.x - e1.x, e2.y - e1.y);
                    if (dist < (e1.radius + e2.radius) + 40) { 
                        triggerDodgeAction(e1, e2.x, e2.y);
                        createFloatingText(e1.x, e1.y - 75, '⚡ 完美躲避！', '#ff33cc');
                        
                        if (e2.type === 'dodgeball') {
                            e2.consecutiveDodges++;
                            createFloatingText(e2.x, e2.y - 40, `🏐 被閃避! (${e2.consecutiveDodges}/3)`, '#ffcc00');
                            if (e2.consecutiveDodges >= 3) {
                                e2.speed = e2.baseSpeed * 1.5; 
                                createFloatingText(e2.x, e2.y - 75, `🔥 閃避球暴走！`, '#ffaa00');
                            }
                        }
                    }
                }
            }
        }

        // 2. 常規實體碰撞
        for (let i = 0; i < entities.length; i++) {
            for (let j = i + 1; j < entities.length; j++) {
                let e1 = entities[i], e2 = entities[j];
                if (e1.type === e2.type || e1.hp <= 0 || e2.hp <= 0) continue; // 同陣營完全免疫

                let dx = e2.x - e1.x; let dy = e2.y - e1.y;
                let dist = Math.hypot(dx, dy);
                let minDist = e1.radius + e2.radius; 

                if (dist < minDist) {
                    // 常規角色的 30% 機率閃避閃避球
                    let e2DodgedBall = (e1.type === 'dodgeball' && Math.random() < 0.3);
                    let e1DodgedBall = (e2.type === 'dodgeball' && Math.random() < 0.3);

                    if (e2DodgedBall) {
                        e1.consecutiveDodges++;
                        createFloatingText(e2.x, e2.y - 75, '⚡ 幸運閃避！', '#ffcc00');
                        if (e1.consecutiveDodges >= 3) e1.speed = e1.baseSpeed * 1.5;
                    }
                    if (e1DodgedBall) {
                        e2.consecutiveDodges++;
                        createFloatingText(e1.x, e1.y - 75, '⚡ 幸運閃避！', '#ffcc00');
                        if (e2.consecutiveDodges >= 3) e2.speed = e2.baseSpeed * 1.5;
                    }

                    // 彈開
                    let overlap = minDist - dist;
                    let nx = dx / dist; let ny = dy / dist;
                    e1.x -= nx * (overlap / 2); e1.y -= ny * (overlap / 2);
                    e1.vx = -nx; e1.vy = -ny;
                    e2.x += nx * (overlap / 2); e2.y += ny * (overlap / 2);
                    e2.vx = nx;  e2.vy = ny;

                    e1.hitEffect = 8; e2.hitEffect = 8;
                    resolveCollisionPayloads(e1, e2, e1DodgedBall, e2DodgedBall);
                }
            }
        }
    }

    function resolveCollisionPayloads(e1, e2, e1Dodged, e2Dodged) {
        // --- E1 傷害 輸出給 E2 ---
        let dmgToE2 = 0;
        if (!e2Dodged) {
            if (e1.type === 'vampire') { 
                dmgToE2 = 20; 
                e2.bleedTimer = 180; // 3秒流血
                // 【吸血鬼效果】造成多少傷害就補多少血
                let heal = dmgToE2;
                e1.hp = Math.min(e1.maxHp, e1.hp + heal);
                createFloatingText(e1.x, e1.y - 45, `💚 吸血 +${heal}`, '#00ff00');
            }
            else if (e1.type === 'wheelchair') dmgToE2 = 25;
            else if (e1.type === 'armor') dmgToE2 = 15;
            else if (e1.type === 'gem') dmgToE2 = 10;
            else if (e1.type === 'archer') dmgToE2 = 10; 
            else if (e1.type === 'dodgemaster') dmgToE2 = 15; 
            else if (e1.type === 'dodgeball') { 
                dmgToE2 = (e1.consecutiveDodges >= 3) ? 100 : 50; 
                e1.consecutiveDodges = 0; e1.speed = e1.baseSpeed; 
            }
        }

        // --- E2 傷害 輸出給 E1 ---
        let dmgToE1 = 0;
        if (!e1Dodged) {
            if (e2.type === 'vampire') { 
                dmgToE1 = 20; 
                e1.bleedTimer = 180; 
                // 【吸血鬼效果】造成多少傷害就補多少血
                let heal = dmgToE1;
                e2.hp = Math.min(e2.maxHp, e2.hp + heal);
                createFloatingText(e2.x, e2.y - 45, `💚 吸血 +${heal}`, '#00ff00');
            }
            else if (e2.type === 'wheelchair') dmgToE1 = 25;
            else if (e2.type === 'armor') dmgToE1 = 15;
            else if (e2.type === 'gem') dmgToE1 = 10;
            else if (e2.type === 'archer') dmgToE1 = 10;
            else if (e2.type === 'dodgemaster') dmgToE1 = 15;
            else if (e2.type === 'dodgeball') { 
                dmgToE1 = (e2.consecutiveDodges >= 3) ? 100 : 50; 
                e2.consecutiveDodges = 0; e2.speed = e2.baseSpeed;
            }
        }

        if (dmgToE2 > 0) { e2.hp -= dmgToE2; createFloatingText(e2.x, e2.y - 75, `-${dmgToE2}`, '#ff4d4d'); }
        if (dmgToE1 > 0) { e1.hp -= dmgToE1; createFloatingText(e1.x, e1.y - 75, `-${dmgToE1}`, '#ff4d4d'); }
    }

    function updateProjectiles() {
        for (let i = arrows.length - 1; i >= 0; i--) {
            let a = arrows[i];
            a.x += a.vx * a.speed;
            a.y += a.vy * a.speed;

            if (a.x < 0 || a.x > canvas.width || a.y < 0 || a.y > canvas.height) {
                arrows.splice(i, 1); continue;
            }

            for (let j = 0; j < entities.length; j++) {
                let e = entities[j];
                if (e.hp <= 0 || e === a.owner || e.type === a.owner.type) continue; // 同陣營穿透

                let dist = Math.hypot(a.x - e.x, a.y - e.y);
                if (dist < e.radius) {
                    if (e.type === 'dodgemaster' && e.dodgeCooldown <= 0) {
                        triggerDodgeAction(e, a.x, a.y);
                        createFloatingText(e.x, e.y - 75, '⚡ 完美截擊！', '#ff33cc');
                        
                        if (a.owner && a.owner.hp > 0) {
                            let angle = Math.atan2(a.owner.y - e.y, a.owner.x - e.x);
                            arrows.push({
                                x: e.x, y: e.y,
                                vx: Math.cos(angle), vy: Math.sin(angle),
                                speed: 10, damage: a.damage, owner: e, isCounter: true
                            });
                        }
                    } else {
                        e.hp -= a.damage;
                        createFloatingText(e.x, e.y - 75, `🏹 -${a.damage}`, '#99ff33');
                    }
                    arrows.splice(i, 1);
                    break;
                }
            }
        }
    }

    function updateStatusBar() {
        if (entities.length === 0) return;
        let v = entities.filter(e => e.type === 'vampire').length;
        let d = entities.filter(e => e.type === 'dodgeball').length;
        let w = entities.filter(e => e.type === 'wheelchair').length;
        let a = entities.filter(e => e.type === 'armor').length;
        let g = entities.filter(e => e.type === 'gem').length;
        let r = entities.filter(e => e.type === 'archer').length;
        let m = entities.filter(e => e.type === 'dodgemaster').length;
        
        let aliveTypes = [...new Set(entities.map(e => e.type))];
        if (aliveTypes.length === 1) {
            let label = {vampire:'🧛 吸血鬼', dodgeball:'🏐 閃避球', wheelchair:'♿ 輪椅', armor:'🛡️ 盔甲', gem:'💎 寶石', archer:'🏹 弓箭', dodgemaster:'👤 閃避大師'}[entities[0].type];
            statusBar.innerText = `🏆 競技結束！贏家是：${label} 陣營！`;
        } else {
            statusBar.innerText = `存活 -> 🧛:${v} | 🏐:${d} | ♿:${w} | 🛡️:${a} | 💎:${g} | 🏹:${r} | 👤:${m}`;
        }
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        entities.forEach(e => e.update());
        checkCollisions();
        updateProjectiles();

        // 盔甲死亡碎裂
        entities.forEach(e => {
            if (e.hp <= 0 && e.type === 'armor' && !e.hasShattered) {
                e.hasShattered = true;
                triggerArmorShatter(e);
            }
        });
        entities = entities.filter(e => e.hp > 0);
        
        // 繪製碎甲衝擊波
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.radius += (p.maxRadius - p.radius) * 0.15; p.life--;
            ctx.save();
            ctx.strokeStyle = `rgba(160, 160, 160, ${p.life / 20})`;
            ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
            if (p.life <= 0) particles.splice(i, 1);
        }

        // 繪製寶石雷射
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            ctx.save();
            ctx.strokeStyle = `rgba(0, 255, 255, ${l.life / 10})`;
            ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff';
            ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            ctx.restore();
            l.life--;
            if (l.life <= 0) lasers.splice(i, 1);
        }

        // 繪製箭矢
        arrows.forEach(a => {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(Math.atan2(a.vy, a.vx) + Math.PI / 4);
            if (a.isCounter) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ffff';
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(-15, -15, 30, 30);
            }
            ctx.fillStyle = '#99ff33';
            ctx.font = '36px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('🏹', 0, 0);
            ctx.restore();
        });

        entities.forEach(e => e.draw());
        updateStatusBar();

        // 巨大跳字提示 (26px)
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 0.8; ft.life--;
            ctx.fillStyle = ft.color;
            ctx.font = 'bold 26px sans-serif'; 
            ctx.textAlign = 'center';
            ctx.fillText(ft.text, ft.x, ft.y);
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        requestAnimationFrame(loop);
    }
    
    loop();
</script>
</body>
</html>
